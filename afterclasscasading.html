<!DOCTYPE html>
<html>
    <head>
        <title> typography </title>
        <style>
            h1{
                text-transform: capitalize;
                text-decoration: underline;
                }
             h2{
                text-transform: uppercase;
                text-decoration: overline;
                }    
            h3{
                text-transform: lowercase;
                text-decoration: underline overline;
                }    
            h4{
                text-transform: none;
                text-decoration: linethrough;
                }   
                
                

        </style>
    </head>
    <body>
        <h1>codingal</h1>
        <h2>codingal</h2>
        <h3>codingal</h3>
        <h4>codingal</h4>    
        <title>typography</title>
        <style>
            #myid{
                background-color:aquamarine;
                width:400px;
                height: 400px;
                font-size:24px;
                }
               #myid1{
                background-color:aquamarine;
                width:400px;
                height: 400px;
                font-size:24px;
                rotate: 180deg;
                } 


        </style>
    </head>
    <body>
        <div id="myid">
        codingal
    </div>
    <div id="myid1">
        codingal
    </div> 
    <title>typography</title>
        <style>
            h1{
                font-size: 60px;
                color:darkmagenta;
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                }
                p{
                     font-size: 30px;
                     color:aquamarine;
                     font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
                     }
        </style>
    </head>
    <body>
        <h1>html</h1>
        <p>Australia is wider than the moon.</p>
    </body>  
</html>
