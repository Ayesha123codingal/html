<!DOCTYPE html>
<html>
    <head>
        <title>Animation</title>
        <style>
            @keyframes example { 
                0% {background-color:hotpink}
                25% {background-color:crimson}
                50% {background-color:darkmagenta}
                100% {background-color:darkviolet}
               }
        </style>
    </head>
</html>
